<defs><clipPath id="win"><rect width="900" height="496" rx="10"/></clipPath></defs>
<g clip-path="url(#win)">
<rect width="900" height="496" fill="#0d1117"/>
<rect width="900" height="34" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="450.0" y="22" fill="#7d8590" text-anchor="middle" style="font-size:13px">mcp-relay - real local run</text>
<text class="l a0" x="22" y="66" fill="#7d8590"># 1. On the cloud host</text>
<text class="l a1" x="22" y="86"><tspan fill="#d29922">$ </tspan><tspan fill="#e6edf3">mcp-relay server</tspan></text>
<rect class="c1" x="38.8" y="71" width="138.4" height="20" fill="#0d1117"/>
<text class="l a2" x="22" y="106"><tspan fill="#3fb950">INFO </tspan><tspan fill="#e6edf3"> StreamableHTTP session manager started</tspan></text>
<text class="l a3" x="22" y="126"><tspan fill="#3fb950">INFO </tspan><tspan fill="#e6edf3"> Application startup complete.</tspan></text>
<text class="l a5" x="22" y="166" fill="#7d8590"># 2. On your computer: config.yaml declares `localtools`, a local stdio MCP server</text>
<text class="l a6" x="22" y="186"><tspan fill="#d29922">$ </tspan><tspan fill="#e6edf3">mcp-relay client</tspan></text>
<rect class="c6" x="38.8" y="171" width="138.4" height="20" fill="#0d1117"/>
<text class="l a7" x="22" y="206"><tspan fill="#3fb950">INFO </tspan><tspan fill="#e6edf3"> WebSocket connection established</tspan></text>
<text class="l a8" x="22" y="226"><tspan fill="#3fb950">INFO </tspan><tspan fill="#e6edf3"> authenticated registration succeeded for client 00c16254…</tspan></text>
<text class="l a9" x="22" y="246"><tspan fill="#3fb950">INFO </tspan><tspan fill="#e6edf3"> tool catalog published (2 tools)</tspan></text>
<text class="l a11" x="22" y="286" fill="#7d8590"># 3. Your AI agent's MCP connection (here: a Python MCP client)</text>
<text class="l a12" x="22" y="306"><tspan fill="#56d4dd">→ </tspan><tspan fill="#79c0ff">tools/list</tspan></text>
<rect class="c12" x="38.8" y="291" width="88.0" height="20" fill="#0d1117"/>
<text class="l a13" x="38.8" y="326" fill="#e6edf3">relay_status  relay_registry_search  localtools_list_dir  localtools_read_file</text>
<text class="l a14" x="22" y="346"><tspan fill="#56d4dd">→ </tspan><tspan fill="#79c0ff">relay_status</tspan></text>
<rect class="c14" x="38.8" y="331" width="104.8" height="20" fill="#0d1117"/>
<text class="l a15" x="38.8" y="366" fill="#e6edf3">client: connected=true report=live   localtools: running, stdio, 2 tools</text>
<text class="l a16" x="22" y="386"><tspan fill="#56d4dd">→ </tspan><tspan fill="#79c0ff">localtools_read_file {"path": "todo.md"}</tspan></text>
<rect class="c16" x="38.8" y="371" width="340.0" height="20" fill="#0d1117"/>
<text class="l a17" x="38.8" y="406" fill="#e6edf3"># Today</text>
<text class="l a18" x="38.8" y="426" fill="#e6edf3">- Review the relay PR</text>
<text class="l a19" x="38.8" y="446" fill="#e6edf3">- Reply to the design thread</text>
<text class="l a20" x="38.8" y="466" fill="#e6edf3">- Ship v0.1.0</text>
</g>
</svg>
