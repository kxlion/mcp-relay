# Dependency update pull requests. Actions stay pinned to commit SHAs;
# Dependabot updates the SHA and its version comment together. A new release
# is proposed only after a week, so a compromised or broken release has time
# to be caught upstream first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "Dependencies"
