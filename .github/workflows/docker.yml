# Container image for mcp-relay: when a GitHub release is published (or on a
# manual run for an existing release tag), build the Dockerfile at that tag,
# smoke-test the Relay Server in the container, then push a linux/amd64 +
# linux/arm64 image to ghcr.io with the job's GITHUB_TOKEN.
#
# Third-party actions are pinned to full commit SHAs (version in comment).
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: build, smoke-test and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Move latest only for the newest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          newest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$TAG" = "$newest" ]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
          else
            echo "enable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Tag matches the package version
        id: source
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          declared="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$declared" ]; then
            echo "::error::release version '$VERSION' does not match package version '$declared'"
            exit 1
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mcp-relay:smoke
          cache-to: type=gha,mode=max

      - name: Smoke-test the Relay Server in the container
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          reported="$(docker run --rm mcp-relay:smoke --version)"
          if [ "$reported" != "mcp-relay $VERSION" ]; then
            echo "::error::image reports '$reported', expected 'mcp-relay $VERSION'"
            exit 1
          fi

          # Synthetic, single-use tokens for this run only.
          mcp_token="$(openssl rand -hex 32)"
          client_token="$(openssl rand -hex 32)"
          echo "::add-mask::$mcp_token"
          echo "::add-mask::$client_token"

          docker run -d --name relay-smoke \
            -e RELAY_SERVER_MCP_HOST=0.0.0.0 -e RELAY_SERVER_CLIENT_HOST=0.0.0.0 \
            -e RELAY_MCP_TOKEN="$mcp_token" -e RELAY_CLIENT_TOKEN="$client_token" \
            -p 127.0.0.1:8000:8000 -p 127.0.0.1:8001:8001 \
            mcp-relay:smoke server
          trap 'docker logs relay-smoke; docker rm -f relay-smoke >/dev/null' EXIT

          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp || true)"
            [ "$code" != 000 ] && break
            sleep 1
          done
          if [ "$code" != 401 ]; then
            echo "::error::unauthenticated /mcp returned $code, expected 401"
            exit 1
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp \
            -H "Authorization: Bearer $mcp_token" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          if [ "$code" != 200 ]; then
            echo "::error::authenticated initialize returned $code, expected 200"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
