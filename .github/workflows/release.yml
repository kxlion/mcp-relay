# Release for mcp-relay: when a GitHub release is published and CI passed on
# the tagged commit, build the sdist and wheel, check that both install and
# report the release version, then publish them to PyPI through Trusted
# Publishing (OIDC). No API token is stored anywhere.
#
# Third-party actions are pinned to full commit SHAs (version in comment).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the ci-required check run of the tagged commit.
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Tag matches the package version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match package version 'v$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-ci.sh "$GITHUB_SHA"

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      # Each distribution is installed on its own into an isolated environment,
      # so a file missing from the sdist or the wheel fails here, not on PyPI.
      - name: Distributions install and report the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            reported="$(uvx --isolated --no-cache --python 3.14 --from "$dist" mcp-relay --version)"
            if [ "$reported" != "mcp-relay ${TAG#v}" ]; then
              echo "::error::$dist reports '$reported', expected 'mcp-relay ${TAG#v}'"
              exit 1
            fi
            echo "$dist: $reported"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-relay/
    permissions:
      # Exchange the job's OIDC token for a short-lived PyPI upload token.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  installers:
    name: one-line installers
    needs: [build, publish]
    # actionlint does not accept the self-repository form ($/) yet; a
    # reusable workflow in ./ is still read from this workflow's commit.
    uses: ./.github/workflows/installers.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.build.outputs.version }}
